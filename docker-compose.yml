services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: stammdaten
      POSTGRES_USER: stammdaten
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stammdaten"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.prod
    ports:
      - "4000:4000"
volumes:
  pgdata:
